name: build

# Confere a versão, compila a documentação (doc/) e o template (doc/template/) e roda os
# testes em tests/.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a versão nos arquivos
        run: sh scripts/check-version.sh

      - name: Compilar documentação, template e testes
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            (cd doc && latexmk)
            (cd doc/template && latexmk)
            sh scripts/run-tests.sh

      - name: Verificar logs da documentação e do template
        run: |
          if grep -E "^!|There were undefined references|Citation .* undefined|Please \(re\)run" \
               doc/build/*.log doc/template/build/*.log; then
            echo "Problemas encontrados nos logs"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            doc/abntex2-ufv.pdf
            doc/template/template.pdf
